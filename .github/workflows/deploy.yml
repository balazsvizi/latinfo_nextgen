name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 LFTP Mirror Sync
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y lftp
          lftp -c "
          set ftp:ssl-allow no;
          set net:timeout 10;
          set net:max-retries 2;
          set net:reconnect-interval-base 5;
          open -u ${{ secrets.FTP_SERVER_USERNAME || secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror --reverse \
                 --verbose \
                 --only-newer \
                 --ignore-time \
                 --exclude-glob .git/ \
                 --exclude-glob .cursor/ \
                 --exclude-glob belepes/ \
                 --exclude-glob lanueva/ \
                 ./ ./
          "