name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Composer install (nextgen)
        run: composer install --no-dev --optimize-autoloader
        working-directory: nextgen

      # cPanel FTP 550-et ad, ha MKD-zni akar már létező / tiltott mappát (.cursor, belepes).
      # A belépés rewrite-ból megy (/belepes/ → nextgen/login.php), fizikai mappa nem kell.
      - name: Strip paths that break FTP MKD
        run: |
          rm -rf .cursor .vscode .idea belepes
          rm -f .cursorrules

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./
          port: 21
          protocol: ftp
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            hostbase/**
            **/hostbase/**
            /hostbase
            /hostbase/**
            .cursor
            .cursor/**
            **/.cursor
            **/.cursor/**
            .cursorrules
            **/.cursorrules
            belepes
            belepes/**
            **/belepes
            **/belepes/**
            .ftp-deploy-sync-state.json
            .ftp-deploy-sync-state-v2.json
