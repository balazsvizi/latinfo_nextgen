name: FTP Deploy

on:
  push:
    branches:
      - main   # vagy master, attól függően melyik az alapágad

jobs:
  ftp-deploy:
    name: Feltöltés FTP-re
    runs-on: ubuntu-latest
    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fontos, hogy legyen git history a diffhez

      - name: FTP szinkronizáció
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./              # honnan tölt fel
          server-dir: /public_html/  # hova tölt fel a szerveren
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**