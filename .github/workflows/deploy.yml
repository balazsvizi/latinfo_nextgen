name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Composer install (nextgen)
        run: composer install --no-dev --optimize-autoloader
        working-directory: nextgen

      - name: Install git-ftp
        run: sudo apt-get update && sudo apt-get install -y git-ftp

      - name: Catchup Git-FTP
        run: |
          git ftp catchup \
            --user "${{ secrets.FTP_USERNAME }}" \
            --passwd "${{ secrets.FTP_PASSWORD }}" \
            --passive \
            --url "ftp://${{ secrets.FTP_SERVER }}"