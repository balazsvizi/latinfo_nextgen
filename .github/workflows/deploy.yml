name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 LFTP Sync
        uses: newsing/lftp-action@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_SERVER_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          options: "--reverse --verbose --only-newer --ignore-time --exclude .git/ --exclude .cursor/ --exclude belepes/ --exclude lanueva/"
          localDir: "./"
          remoteDir: "./"